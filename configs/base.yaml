version: 1
physics_model_version: rigid_point_payload_v2

paths:
  # Project-local MuJoCo XML contract. Resolve this path from project_root;
  # do not auto-discover or silently substitute another XML/mesh tree.
  mujoco_xml: resources/mujoco/cf21B_500.xml
  project_root: .
  artifact_root: artifacts
  legacy_model_root: model
  legacy_tensorboard_root: tb

vehicle:
  mass: 0.04338
  gravity: 9.81
  arm_length: 0.035355
  motor_direction: [1.0, -1.0, 1.0, -1.0]
  thrust_min: 0.0
  thrust_max: 0.20
  torque_coefficient: 0.00594
  inertia_diagonal: [0.000023951, 0.000023951, 0.000032347]
  physics_hz: 500.0

# Required CF2.1 Brushless motor model.  Every shipped profile inherits this
# first-order actuator path; ``enabled: false`` and instantaneous actuator
# models are intentionally rejected by the configuration contract.
# The polynomial values below are candidate values attributed to "How to Model
# Your Crazyflie Brushless" (arXiv:2603.05944); they are not independently
# verified for this project's XML or hardware.
actuator:
  enabled: true
  model: cf21b_first_order
  time_constant_s: 0.050
  steady_state_gain_rad_s: 2900.0
  thrust_polynomial:
    # F(r) [N] = c3*r^3 + c2*r^2 + c1*r, r = omega / omega_reference.
    # The inverse is limited to this positive-thrust branch; the low-speed
    # polynomial region is not assumed to be physically valid.
    coefficients: [-0.23, 0.562, -0.043]
    omega_reference_rad_s: 2900.0
    positive_branch_min_ratio: 0.0791
    max_ratio: 1.0
  parameter_source: paper_candidate
  verification_status: unverified
  reaction_torque:
    # This is deliberately plant-side. vehicle.torque_coefficient remains the
    # allocator yaw ratio, so the optional polynomial profile can expose their
    # mismatch.
    model: legacy_ratio
    legacy_ratio_m: 0.00594
    polynomial_coefficients: [-3.4, 8.7, 2.9]
    polynomial_scale: 0.0001
    rotor_inertia_kg_m2: 5.0e-8
    include_rotor_acceleration_torque: false
  # auto selects zero RPM for a ground start and hover-equilibrium RPM for an
  # airborne start; explicit zero/hover_equilibrium modes are also supported.
  reset_rpm_mode: auto
  randomization:
    enabled: false
    time_constant_s:
      min: 0.040
      max: 0.060
    steady_state_gain_rad_s:
      min: 2320.0
      max: 3480.0

controller:
  pid:
    kp_position: 4.0
    velocity_limit: 1.5
    kp_velocity: 4.0
    ki_velocity: 1.0
    kd_velocity: 0.0
    kp_attitude: 12.0
    kp_rate: [0.0008, 0.0008, 0.0006]
    ki_rate: [0.0, 0.0, 0.0]
    kd_rate: [0.0, 0.0, 0.0]
    max_tilt_deg: 35.0
    max_torque: 0.02
    max_force: 1.0
    integrator_limit: 2.0

environment:
  control_mode: e2e
  policy_hz: 100.0
  episode_sec: 8.0
  residual_scale: [0.022, 0.022, 0.0001, 0.3]
  position_target: [0.0, 0.0, 1.0]
  yaw_target: 0.0
  position_perturbation: 0.05
  attitude_perturbation_deg: 0.0
  # Opt-in E2E airborne reset curriculum. Disabled preserves the historical
  # cube-position/random-horizontal-axis reset path and its RNG draw order.
  initial_state_randomization:
    enabled: false
    nominal_reset_probability: 0.20
    curriculum_end_step: 300000
    initial_max_tilt_deg: 5.0
    final_max_tilt_deg: 30.0
    initial_max_horizontal_offset_m: 0.02
    final_max_horizontal_offset_m: 0.20
    initial_max_vertical_offset_m: 0.02
    final_max_vertical_offset_m: 0.10
  payload:
    randomize: false
    mass: 0.0
    offset: [0.0, 0.0]
    randomization_limits:
      radius_min: 0.02
      radius_max: 0.10
      torque_fraction: 0.5
      mass_max: 0.015
  reward:
    # All existing profiles stay on the executable legacy reward unless an
    # opt-in profile overrides this field.
    mode: legacy
    position_weight: 3.0
    velocity_weight: 0.5
    tilt_weight: 1.0
    angular_velocity_weight: 0.01
    yaw_weight: 0.8
    action_weight: 0.0
    action_rate_weight: 0.0
    e2e_torque_xy_weight: 0.0
    e2e_torque_yaw_weight: 0.0
    crash_penalty: 10.0
    lyapunov:
      # The legacy reward used raw SI/radian errors and had no normalization
      # tolerances. Unit scales preserve that starting convention; they are
      # configurable per axis and are not claimed to be tuned values.
      normalization:
        position: [1.0, 1.0, 1.0]       # m
        velocity: [1.0, 1.0, 1.0]       # m/s
        attitude: [1.0, 1.0, 1.0]       # geometric error; small-angle rad convention
        angular_rate: [1.0, 1.0, 1.0]   # rad/s, body frame
      # Positive diagonal blocks make P positive definite. They do not prove
      # that this candidate decreases for the actual closed-loop dynamics.
      matrix_weights:
        position: 3.0
        velocity: 0.1
        attitude: 3.0
        angular_rate: 0.001
      state_cost_weight: 1.0
      potential_weight: 1.0
      decay_weight: 1.0
      decay_rate: 1.0  # kappa [1/s]; must satisfy 0 < kappa*policy_dt < 1
      potential_shaping_enabled: true
      decay_penalty_enabled: true
  termination:
    min_altitude: 0.02
    max_altitude: 2.5
    max_tilt_deg: 60.0
    max_position_error: 1.5

training:
  seed: null
  total_timesteps: 1000000
  ppo:
    policy: MlpPolicy
    n_steps: 2048
    batch_size: 256
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    n_epochs: 10
    ent_coef: 0.003
    vf_coef: 0.5
    max_grad_norm: 0.5
    clip_range: 0.1
    target_kl: 0.03
    log_std_init: -1.5
    net_arch: [64, 64]
    device: cpu
    verbose: 0

evaluation:
  episode_count: 30
  seed_start: 1000
  deterministic: true
  tail_fraction: 0.3
  tilt_limit_deg: 30.0
  evaluation_interval: 20000

mission:
  type: hover
  hover_altitude: 1.0
  goto_xy: [1.0, 0.0]
  takeoff_sec: 4.0
  settle_sec: 2.0
  goto_sec: 4.0
  circle_ramp_sec: 2.0
  number_of_laps: 2.0
  post_hold_sec: 2.0
  force_floor_start: false
  hover:
    target: [0.0, 0.0, 1.0]
    yaw_deg: 0.0
    duration: 8.0
  circle:
    center_xy: [0.5, 0.0]
    radius: 0.5
    period: 10.0
    laps: 2.0
    start_angle_deg: 0.0
    direction: ccw
    ramp_sec: 2.0
  lissajous:
    center_xy: [0.0, 0.0]
    amplitude_xy: [0.5, 0.5]
    frequency_ratio: [1, 2]
    phase_deg: 90.0
    base_period: 10.0
    cycles: 2.0
    ramp_sec: 2.0
  circle_presets:
    - key: "1"
      description: radius 0.5m, period 10s (slow/safe)
      radius: 0.5
      period: 10.0
    - key: "2"
      description: radius 1.0m, period 8s (medium)
      radius: 1.0
      period: 8.0
    - key: "3"
      description: radius 0.5m, period 5s (fast/aggressive)
      radius: 0.5
      period: 5.0

experiment:
  name: crazyflie-ppo
  condition: nominal
  description: Active train_ppo_02.py E2E defaults from master
  timezone: Asia/Seoul
