version: 1

paths:
  # This server path is an intentional runtime contract. Do not auto-discover
  # or replace it with a repository-relative XML.
  mujoco_xml: /home/mrl_6534/ros2_ws/src/mujoco_crazyflie/plant/data/cf21B_500.xml
  project_root: .
  artifact_root: artifacts
  legacy_model_root: model
  legacy_tensorboard_root: tb

vehicle:
  mass: 0.04338
  gravity: 9.81
  arm_length: 0.035355
  motor_direction: [1.0, -1.0, 1.0, -1.0]
  thrust_min: 0.0
  thrust_max: 0.20
  torque_coefficient: 0.00594
  inertia_diagonal: [0.000023951, 0.000023951, 0.000032347]
  physics_hz: 500.0

controller:
  pid:
    kp_position: 4.0
    velocity_limit: 1.5
    kp_velocity: 4.0
    ki_velocity: 1.0
    kd_velocity: 0.0
    kp_attitude: 12.0
    kp_rate: [0.0008, 0.0008, 0.0006]
    ki_rate: [0.0, 0.0, 0.0]
    kd_rate: [0.0, 0.0, 0.0]
    max_tilt_deg: 35.0
    max_torque: 0.02
    max_force: 1.0
    integrator_limit: 2.0

environment:
  control_mode: e2e
  policy_hz: 100.0
  episode_sec: 8.0
  residual_scale: [0.022, 0.022, 0.0001, 0.3]
  position_target: [0.0, 0.0, 1.0]
  yaw_target: 0.0
  position_perturbation: 0.05
  attitude_perturbation_deg: 0.0
  payload:
    randomize: false
    mass: 0.0
    offset: [0.0, 0.0]
    randomization_limits:
      radius_min: 0.02
      radius_max: 0.10
      torque_fraction: 0.5
      mass_max: 0.015
  reward:
    position_weight: 3.0
    velocity_weight: 0.01
    tilt_weight: 3.0
    angular_velocity_weight: 0.001
    yaw_weight: 1.0
    action_weight: 0.0
    action_rate_weight: 0.0
    crash_penalty: 10.0
  termination:
    min_altitude: 0.2
    max_altitude: 2.5
    max_tilt_deg: 60.0
    max_position_error: 1.5

training:
  seed: null
  total_timesteps: 1000000
  ppo:
    policy: MlpPolicy
    n_steps: 2048
    batch_size: 256
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    n_epochs: 10
    ent_coef: 0.003
    vf_coef: 0.5
    max_grad_norm: 0.5
    clip_range: 0.1
    target_kl: 0.03
    log_std_init: -1.5
    net_arch: [64, 64]
    device: cpu
    verbose: 0

evaluation:
  episode_count: 30
  seed_start: 1000
  deterministic: true
  tail_fraction: 0.3
  tilt_limit_deg: 30.0
  evaluation_interval: 20000

mission:
  type: hover
  hover_altitude: 1.0
  goto_xy: [1.0, 0.0]
  takeoff_sec: 4.0
  settle_sec: 2.0
  goto_sec: 4.0
  circle_ramp_sec: 2.0
  number_of_laps: 2.0
  post_hold_sec: 2.0
  force_floor_start: false
  circle_presets:
    - key: "1"
      description: radius 0.5m, period 10s (slow/safe)
      radius: 0.5
      period: 10.0
    - key: "2"
      description: radius 1.0m, period 8s (medium)
      radius: 1.0
      period: 8.0
    - key: "3"
      description: radius 0.5m, period 5s (fast/aggressive)
      radius: 0.5
      period: 5.0

experiment:
  name: crazyflie-ppo
  condition: nominal
  description: Active train_ppo_02.py E2E defaults from master
  timezone: Asia/Seoul
