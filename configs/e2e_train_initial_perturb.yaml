extends: e2e_train.yaml

training:
  seed: 42

environment:
  # Disable the historical cube perturbation only in this opt-in profile.
  position_perturbation: 0.0
  attitude_perturbation_deg: 0.0
  initial_state_randomization:
    enabled: true
    nominal_reset_probability: 0.20
    curriculum_end_step: 300000
    initial_max_tilt_deg: 5.0
    final_max_tilt_deg: 30.0
    initial_max_horizontal_offset_m: 0.02
    final_max_horizontal_offset_m: 0.20
    initial_max_vertical_offset_m: 0.02
    final_max_vertical_offset_m: 0.10

experiment:
  condition: initial-perturb-curriculum
  description: E2E PPO legacy-reward airborne initial-state recovery curriculum
