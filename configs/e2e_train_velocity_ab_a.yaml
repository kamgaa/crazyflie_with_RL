extends: e2e_train_position_velocity_error.yaml

# A: absolute observation and absolute velocity cost. Generator parameters are
# retained for the common diagnostics; they do not change A's input or reward.
environment:
  e2e_velocity:
    observation_mode: absolute
    reward_mode: absolute

training:
  record_episodes: true
  checkpoint_interval: 100000

experiment:
  condition: velocity-ab-a-absolute-observation-absolute-reward
  description: A control, nominal seed42, corrected physics, fresh training only
